name: ci

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Variables (minúsculas y SHA corto)
        run: |
          echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Login a Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login a GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construir y validar (sin publicar)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: local/test:${{ env.SHORT_SHA }}
          cache-to: type=gha,mode=max

      - name: Validar imagen
        run: |
          docker run -d --name test -p 8080:80 local/test:${{ env.SHORT_SHA }}
          sleep 3
          curl -f http://localhost:8080
          docker rm -f test

      - name: Publicar en ambos registros
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          cache-from: type=gha
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/dds-devops-demo:latest
            ${{ vars.DOCKERHUB_USERNAME }}/dds-devops-demo:${{ env.SHORT_SHA }}
            ghcr.io/${{ env.OWNER }}/dds-devops-demo:latest
            ghcr.io/${{ env.OWNER }}/dds-devops-demo:${{ env.SHORT_SHA }}
